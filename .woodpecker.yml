# CI runs exactly what runs locally: `just check` on the same JDK floor the platform matrix names.
# If it passes on a laptop and fails here, that difference is a real finding rather than a
# configuration guess.
#
# The alpha ships one combination, Fabric 26.2 (docs/spec/contracts/platform-matrix.md); each
# fast-follow combination adds its own job here, never a rebuild of the others (`PLATFORM-REQ-003`).
#
# Temurin 25 is pinned to the JDK major the platform matrix floors on for 26.2; the Gradle wrapper
# fetches its own distribution, so the image needs no Gradle.

when:
  - event: [push, pull_request, manual]

steps:
  - name: check
    image: eclipse-temurin:25-jdk
    environment:
      # Gradle's daemon has nothing to keep warm in a one-shot container.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    commands:
      - ./.ci/install-tools.sh
      - just check
